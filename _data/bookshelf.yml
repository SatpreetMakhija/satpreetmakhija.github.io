- title: "Mathematica: A Secret World of Intuition and Curiosity"
  author: David Bessis
  goodreads: https://www.goodreads.com/book/show/200128457-mathematica
  note: "This book helped me understand what mathematics really is: how mathematicians think, what intuition means to them, and the role logic plays in their thinking."

- title: "Adult Children of Alcoholics"
  author: Janet Geringer Woititz
  goodreads: https://www.goodreads.com/book/show/142957.Adult_Children_of_Alcoholics
  note: "This book helped me understand how relative our sense of normal is. Your normal and someone else's normal might not be the same."

- title: "The Beginning of Infinity: Explanations That Transform the World"
  author: David Deutsch
  goodreads: https://www.goodreads.com/book/show/10483171-the-beginning-of-infinity
  note: "This book is a software upgrade for the mind, and I don't say that lightly. I don't agree with everything Deutsch says, but some chapters are amazing—especially ‘The Reach of Explanations’ and ‘Why are Flowers Beautiful?’"

- title: "A Man Called Ove"
  author: Fredrik Backman
  goodreads: https://www.goodreads.com/book/show/18870090-a-man-called-ove
  note: "Some books break your heart in one chapter and warm it in the next. *A Man Called Ove* is one of them. Ove feels like someone you rarely meet anymore."

- title: "Improve Your Conversations"
  author: Patrick King
  goodreads: https://www.goodreads.com/book/show/70785195-improve-your-conversations
  note: "Conversation is a skill you can learn, and it has a lot in common with improv. This book helps you see conversation through that lens and get better at it in the process."
