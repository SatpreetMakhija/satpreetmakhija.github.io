<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}"{% if page.permalink == '/' %} aria-current="page"{% endif %}>{{ site.first_name }} {{ site.last_name }}</a>
  <nav aria-label="Main navigation">
    {% assign navigation_pages = site.pages | sort: "nav_order" %}
    {% for item in navigation_pages %}
      {% if item.nav and item.autogen == nil %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>
